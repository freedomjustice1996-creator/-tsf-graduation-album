<style>
:root{
  --bg:#0d0f14; --panel:#171a22; --panel2:#202530; --text:#f3f4f6;
  --muted:#a8afbd; --accent:#cfd6e6; --line:#2d3442; --danger:#d8a2a2;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif}
body{min-height:100vh}
button{font:inherit}
#app{max-width:900px;margin:0 auto;padding:18px 14px 48px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.title{font-weight:700;letter-spacing:.04em}
.small{font-size:.82rem;color:var(--muted)}
.card{background:linear-gradient(180deg,var(--panel),#12151c);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.22)}
.hero{padding:28px 20px}
h1,h2,h3{margin:.2em 0 .6em}
p{line-height:1.9;margin:.55em 0}
button{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:13px 14px;border-radius:14px;cursor:pointer}
button:hover{filter:brightness(1.08)}
button.primary{background:#e8ecf5;color:#11151c;border:none;font-weight:700}
button.ghost{background:transparent}
.actions{display:grid;gap:10px;margin-top:18px}
.choice{width:100%;text-align:left;line-height:1.5}
.quote{border-left:3px solid #596275;padding-left:12px;color:#e7eaf0}
.scene-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
.progress{height:8px;background:#252b37;border-radius:999px;overflow:hidden;margin:10px 0 18px}
.progress>div{height:100%;background:#cfd6e6;width:0}
.photo{min-height:230px;border-radius:16px;border:1px solid var(--line);background:
 radial-gradient(circle at 75% 22%,rgba(255,255,255,.12),transparent 25%),
 linear-gradient(135deg,#232936,#12151b 55%,#1b202a);display:flex;align-items:flex-end;padding:18px;margin:12px 0}
.photo .caption{background:rgba(5,7,10,.68);backdrop-filter:blur(8px);padding:11px 12px;border-radius:12px;width:100%;font-size:.92rem}
.tagrow{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.tag{font-size:.72rem;color:#cbd1dc;border:1px solid #3b4353;border-radius:999px;padding:5px 8px}
.nav{display:flex;gap:8px;flex-wrap:wrap}
.hidden{display:none!important}
.album-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.album-item{background:#131720;border:1px solid var(--line);border-radius:14px;padding:12px;min-height:126px}
.album-item b{display:block;margin-bottom:8px}
.lock{opacity:.35}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.68);display:flex;align-items:flex-end;justify-content:center;padding:14px;z-index:20}
.modal>.sheet{width:min(900px,100%);max-height:88vh;overflow:auto;background:#11151c;border:1px solid var(--line);border-radius:20px 20px 14px 14px;padding:18px}
.statbar{display:grid;grid-template-columns:130px 1fr 40px;gap:8px;align-items:center;margin:8px 0}
.statbar .bar{height:8px;border-radius:99px;background:#242a34;overflow:hidden}
.statbar .bar i{display:block;height:100%;background:#c9d0dc}
hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.end-title{font-size:1.7rem}
.footer-note{margin-top:16px;font-size:.78rem;color:var(--muted)}
@media (max-width:600px){
  #app{padding:12px 10px 36px}
  .card{padding:15px}
  .hero{padding:22px 16px}
  .statbar{grid-template-columns:110px 1fr 34px}
}
</style>
</head>

 }

function clamp(v){return Math.max(0,Math.min(100,v))}
function rel(p){return S.relations[p] || (S.relations[p]=baseRelation())}

function applyChoice(choice){
 Object.entries(choice.delta||{}).forEach(([k,v])=>{
   if(typeof S[k]!=="number") S[k]=0;
   S[k]=clamp(S[k]+v);
 });
 (choice.flags||[]).forEach(f=>S.flags[f]=true);
 if(choice.rels){
   Object.entries(choice.rels).forEach(([p,a])=>{
     let r=rel(p);
     r.closeness=clamp(r.closeness+(a[0]||0));
     r.trust=clamp(r.trust+(a[1]||0));
     r.habit=clamp(r.habit+(a[2]||0));
     r.awareness=clamp(r.awareness+(a[3]||0));
   });
 }
 cascade();
}

function cascade(){
 // Complex, non-obvious growth: effects arise from accumulated life, not one choice.
 let social = (S.sociability+S.emotional_openness+S.conformity)/3;
 let presentation = (S.appearance_interest+S.self_presentation+S.hobby_fashion+S.hobby_grooming)/4;
 let memory = S.memory_accept;

 // body drift only when several conditions combine
 let drift = 0;
 if(S.flags.p03_considered_growing_hair) drift += 1.2;
 if(S.flags.p05_tried_aoi_recommendation && S.appearance_interest>35) drift += 1.2;
 if(S.flags.p09_stage_experience && S.adventure>40) drift += .8;
 if(S.flags.p10_tried_item && S.self_presentation>40) drift += .8;
 if(memory>45 && presentation>35) drift += .9;
 if(social>45 && S.memory_accept>55) drift += .6;
 S.body_feminization=clamp(S.body_feminization+drift);

 // growth dimensions diverge
 if(drift>0){
  S.growth_face=clamp(S.growth_face+drift*0.9);
  S.growth_hair_skin=clamp(S.growth_hair_skin+drift*0.7);
  S.growth_body_balance=clamp(S.growth_body_balance+drift*0.8);
  if(S.caution>S.adventure) S.growth_frame=clamp(S.growth_frame+drift*0.25);
  else S.growth_voice=clamp(S.growth_voice+drift*0.15);
 }

 // self/social identity are related but not identical
 let socialPressure=(S.social_yuka + presentation + S.body_feminization)/3;
 if(S.memory_accept>45 && socialPressure>40) S.self_yuka=clamp(S.self_yuka+0.8);
 if(S.body_feminization>45 && S.memory_accept>50) S.social_yuka=clamp(S.social_yuka+1.1);
 if(S.flags.p08_many_yearbook_messages) S.social_yuka=clamp(S.social_yuka+.4);

 updateIdentity();
}

function updateIdentity(){
 const ns = S.social_yuka*.30 + S.self_yuka*.25 + S.memory_accept*.20 + S.body_feminization*.15 + (S.flags.p08_many_yearbook_messages?10:0)*.10;
 if(ns<30) S.currentName="神谷 悠斗";
 else if(ns<50) S.currentName="神谷 ゆう";
 else if(ns<70) S.currentName = S.self_yuka>=50 ? "神谷 悠香" : "神谷 悠斗";
 else S.currentName="神谷 悠香";

 // pronoun is independent from body/name
 if(S.self_yuka>72 && S.emotional_openness>45) S.pronoun="私";
 else if(S.caution>62 && S.self_yuka>35) S.pronoun="自分";
 else if(S.sociability<25 && S.caution>55) S.pronoun="僕";
 else S.pronoun="俺";
}

function bodyText(){
 const b=S.body_feminization;

 let base = b<30?"元の悠斗に近い成長":b<50?"細身で中性的な印象":b<70?"顔立ちや体格に女性寄りの要素が増えた姿":"周囲からは女性として見られやすい姿";
 return `${base}。顔 ${Math.round(face)} / 声 ${Math.round(voice)} / 骨格 ${Math.round(frame)}。`;
}
function styleText(){
 if(S.appearance_interest<30) return "実用性優先で、服にはあまりこだわらない";
 if(S.appearance_interest<60) return "好き嫌いが少しずつはっきりしている";
 return "自分なりの服・髪・小物の選び方が定着している";
}
function topHobbies(){

  ["写真",S.hobby_photo],["スポーツ",S.hobby_sports],["ゲーム",S.hobby_games],["音楽",S.hobby_music],
  ["ファッション",S.hobby_fashion],["収集",S.hobby_collecting],["読書",S.hobby_reading],["創作",S.hobby_creative],["料理",S.hobby_cooking]
 ];
 return arr.sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>x[0]);
}
function closestPeople(){
 return Object.entries(S.relations).sort((a,b)=>{
  const av=a[1].closeness+a[1].trust+a[1].habit+a[1].future_commitment;
  const bv=b[1].closeness+b[1].trust+b[1].habit+b[1].future_commitment;
  return bv-av
 }).slice(0,3).map(([k])=>personNames[k]);
}
function chapterCaption(ch){

 const b=S.body_feminization;

 return extra;
}

  <div><div class="title">${ch.title}</div><div class="small">選択 ${idx+1} / ${ch.choices.length}</div></div>
  <button onclick="openAlbum()">アルバム</button>
 </div>
 <div class="progress"><div style="width:${((idx+1)/ch.choices.length)*100}%"></div></div>
 <div class="card">
  <h3>${block.prompt}</h3>
  <p class="small">選択肢が示す意味は、これまでの関係や性格によって変わります。</p>
  <div class="actions">
   ${available.map((x,i)=>`<button class="choice" onclick="choose(${idx},${block.choices.indexOf(x)})">${x.text}</button>`).join("")}
  </div>
 </div>`;
}
function choose(qi,ci){
 const ch=CHAPTERS[S.chapter];
 const choice=ch.choices[qi].choices[ci];
 applyChoice(choice);
 // relationship continuation across late chapters
 if(ch.no>=11){
  Object.values(S.relations).forEach(r=>{
   if(S.flags.p11_promised_post_graduation_contact) r.future_commitment=clamp(r.future_commitment+1);
  });
 }
 S.scene++;
 save();
 if(S.scene<=ch.choices.length) renderScene(ch,S.scene-1);
 else finishChapter(ch);
}
function finishChapter(ch){
 updateIdentity();
 const entry={
  no:ch.no,title:ch.title,name:S.currentName,pronoun:S.pronoun,
  body:bodyText(),style:styleText(),caption:chapterCaption(ch),tags:photoTags(ch)
 };
 const existing=S.album.findIndex(x=>x.no===ch.no);
 if(existing>=0) S.album[existing]=entry; else S.album.push(entry);
 // old-world remnants begin after ch7
 if(ch.no>=7 && (S.memory_accept>45 || ch.no>=13)) S.old_world_sense=clamp(S.old_world_sense+(ch.no>=13?3:1));
 if(ch.no>=8) S.social_yuka=clamp(S.social_yuka + S.body_feminization/100);
 if(ch.no>=10) S.identity_stability=clamp(S.identity_stability+2);
 cascade();
 save();

 if(ch.final){
   return finishGame();
 }
 document.getElementById("app").innerHTML=`
 <div class="card">
   <div class="small">CHAPTER ${ch.no} CLEAR</div>
   <h2>写真 No.${String(ch.no).padStart(2,"0")}「${ch.title}」</h2>
   <div class="photo"><div class="caption"><b>${S.currentName}</b><br>${entry.caption}</div></div>
   <p>現代へ戻る。</p>
   <p class="quote">写真は変わっている。けれど本人には、これが昔からの自分の記憶だ。</p>
   <div class="actions">
    <button class="primary" onclick="advanceChapter()">次の写真へ</button>
    <button onclick="openAlbum()">アルバムを見る</button>
   </div>
 </div>`;
}
function advanceChapter(){
 S.chapter=Math.min(S.chapter+1,14); S.scene=0; save(); startChapter(S.chapter,0);
}

function endingScores(){
 return {
  body:S.body_feminization,
  self:S.self_yuka,
  social:S.social_yuka,
  memory:S.memory_accept,
  stable:S.identity_stability,
  old:S.old_world_sense,
  oldAttach:S.old_life_attachment,
  current:S.current_life_acceptance
 }
}
function decideEnding(){
 const x=endingScores();
 if(x.old>=65 && S.flags.asked_about_yuto && x.memory>=55) return "TRUE";
 if(x.old>=55 && x.memory>=60 && x.oldAttach>=25 && x.stable>=45) return "E";
 if(x.body>=65 && x.self>=65 && x.social>=65 && x.memory>=65 && x.old<45) return "G";
 if(x.body>=60 && x.self>=50 && x.social>=60 && x.old>=35 && x.stable>=45) return "F";
 if(x.body>=60 && x.self<45) return "D";
 if(x.body<55 && x.social>=50 && x.self<45) return "C";
 if(x.self<35 && x.social<40 && x.body<40 && (S.hobby_photo+S.hobby_fashion+S.sociability)>90) return "B";
 return "A";
}
const ENDINGS={
 A:{title:"神谷悠斗",text:"元の人生と同じではない。それでも、ここまで積み上げた人生は確かに神谷悠斗のものだった。"},
 B:{title:"少し違う青春",text:"名前も自己認識も悠斗。それでも友人、趣味、写真、進路は最初とはかなり違う。別の青春を歩いた悠斗。"},
 C:{title:"俺なのに、俺じゃない",text:"身体は元の姿を多く残す一方、名前や社会の記憶は別の人生へ寄っている。本人の中にだけ、説明できないズレが残った。"},
 D:{title:"身体だけが先に",text:"身体は大きく変わった。それでも自己認識の核には悠斗が強く残る。矛盾した二つの感覚が、どちらも自分として共存する。"},
 E:{title:"二つの人生",text:"元の人生も、改変された人生も、どちらも『生きた』感覚がある。片方を偽物として捨てることはできない。"},
 F:{title:"悠香として生きる悠斗",text:"現在は悠香として自然に生きている。それでも、悠斗だった人生も自分の一部として覚えている。"},
 G:{title:"神谷悠香",text:"写真の最初から最後まで、主人公には一本の自然な人生としてつながっている。アルバムの題名は『神谷悠香のアルバム』。"},
 TRUE:{title:"写真の外側",text:"写真は過去を塗り替えたのではない。写真に残り得た別の人生を選び、その現在へ移動していた。元の悠斗も、悠香も、別の分岐として残っている。"}
}
function finishGame(){
 S.ending=decideEnding(); save(); renderEnding();
}
function renderEnding(){
 const e=ENDINGS[S.ending||decideEnding()];
 const cp=closestPeople(), hb=topHobbies();
 document.getElementById("app").innerHTML=`
 <div class="card">
  <div class="small">ENDING</div>
  <h1 class="end-title">${e.title}</h1>
  <p>${e.text}</p>
  <hr>
  <h3>${S.currentName}・24歳</h3>
  <p>${bodyText()}</p>
  <p>現在の一人称：<b>${S.pronoun}</b></p>
  <p>強く残った趣味：<b>${hb.join("・")}</b></p>
  <p>人生に残った人物：<b>${cp.join("・")}</b></p>
  <p class="quote">15枚の写真を並べた時、そこにあるのは「性別を選んだ結果」ではなく、一人分の人生だった。</p>
  <div class="actions">
   <button class="primary" onclick="openAlbum()">完成したアルバムを見る</button>
   <button onclick="openStats()">人生データを見る</button>
   <button class="ghost" onclick="renderHome()">タイトルへ</button>
  </div>
 </div>`;
}

function openAlbum(){
 const items=CHAPTERS.map(ch=>{
   const a=S.album.find(x=>x.no===ch.no);
   if(!a) return `<div class="album-item lock"><b>${String(ch.no).padStart(2,"0")} ${ch.title}</b><span class="small">未取得</span></div>`;
   return `<div class="album-item"><b>${String(ch.no).padStart(2,"0")} ${ch.title}</b><div class="small">${a.name} / ${a.pronoun}</div><p class="small">${a.caption}</p></div>`;
 }).join("");
 document.body.insertAdjacentHTML("beforeend",`
 <div class="modal" id="albumModal" onclick="if(event.target===this)this.remove()">
  <div class="sheet">
   <div class="scene-head"><div><h2>アルバム</h2><div class="small">${S.album.length}/15 枚</div></div><button onclick="document.getElementById('albumModal').remove()">閉じる</button></div>
   <div class="album-grid">${items}</div>
  </div>
 </div>`);
}
function openStats(){
 const keys=["body_feminization","self_yuka","social_yuka","memory_accept","appearance_interest","self_presentation","initiative","emotional_openness","sociability","old_world_sense","identity_stability"];
 const names={
  body_feminization:"身体変化",self_yuka:"自己認識",social_yuka:"社会認識",memory_accept:"記憶定着",
  appearance_interest:"外見関心",self_presentation:"自己演出",initiative:"主体性",emotional_openness:"感情開示",
  sociability:"社交性",old_world_sense:"旧世界感応",identity_stability:"自己統合"
 };
 document.body.insertAdjacentHTML("beforeend",`
 <div class="modal" id="statsModal" onclick="if(event.target===this)this.remove()">
  <div class="sheet">
   <div class="scene-head"><div><h2>内部状態（開発用）</h2><div class="small">通常プレイでは非表示にする想定</div></div><button onclick="document.getElementById('statsModal').remove()">閉じる</button></div>
   ${keys.map(k=>`<div class="statbar"><span>${names[k]}</span><span class="bar"><i style="width:${clamp(S[k]||0)}%"></i></span><b>${Math.round(S[k]||0)}</b></div>`).join("")}
   <hr>
   <p><b>現在名：</b>${S.currentName}</p>
   <p><b>一人称：</b>${S.pronoun}</p>
   <p><b>身体：</b>${bodyText()}</p>
   <p><b>趣味：</b>${topHobbies().join("・")}</p>
   <p><b>近い人物：</b>${closestPeople().join("・")}</p>
  </div>
 </div>`);
}

renderHome();

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}
</script>
